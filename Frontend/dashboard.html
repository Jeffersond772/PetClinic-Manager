<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Panel</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body class="dashboard-body">

  <header class="topbar">
    <h1>PetClinic Manager</h1>
    <div class="usuario-info">
      <span id="nombreUsuario"></span>
      <span id="rolUsuario" class="badge-rol"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebarMenu">
      <!-- Los enlaces se generan dinámicamente según el rol -->
    </nav>

    <main class="contenido">
  <h2 id="saludo">Bienvenido</h2>
  <p class="texto-secundario" id="fechaHoy"></p>

  <div class="tarjetas-resumen" id="tarjetasResumenDashboard"></div>

  <div class="grid-graficos">
    <div class="tarjeta-grafico">
      <h3>Ingresos vs Gastos (este mes)</h3>
      <canvas id="graficoFinancieroDashboard"></canvas>
    </div>
    <div class="tarjeta-grafico">
      <h3>Consultas por día (este mes)</h3>
      <canvas id="graficoConsultasDashboard"></canvas>
    </div>
  </div>

  <div class="grid-graficos">
    <div class="tarjeta-grafico">
      <h3>Próximas citas de hoy</h3>
      <div id="listaProximasCitas" class="lista-proximas-citas"></div>
    </div>
    <div class="tarjeta-grafico">
      <h3>Citas por estado (este mes)</h3>
      <canvas id="graficoCitasEstado"></canvas>
    </div>
  </div>
</main>
  </div>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
