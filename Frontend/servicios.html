<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Servicios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

  <header class="topbar">
    <h1>PetClinic Manager</h1>
    <div class="usuario-info">
      <span id="nombreUsuario"></span>
      <span id="rolUsuario" class="badge-rol"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebarMenu"></nav>

    <main class="contenido">
      <div class="encabezado-seccion">
        <h2>Servicios</h2>
        <button id="btnNuevoServicio" class="btn-primario">Nuevo servicio</button>
      </div>

      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Descripción</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tablaServicios"></tbody>
      </table>
    </main>
  </div>

  <div id="modalServicio" class="modal-overlay oculto">
    <div class="modal-caja">
      <h3 id="tituloModalServicio">Nuevo servicio</h3>
      <form id="formServicio">
        <input type="hidden" id="idServicio">

        <label for="nombreServicio">Nombre</label>
        <input type="text" id="nombreServicio" required>

        <label for="precioServicio">Precio</label>
        <input type="number" step="0.01" id="precioServicio" required>

        <label for="descripcionServicio">Descripción</label>
        <textarea id="descripcionServicio" rows="2"></textarea>

        <p id="mensajeErrorServicio" class="error-mensaje"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelarServicio" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/servicios.js"></script>
</body>
</html>
