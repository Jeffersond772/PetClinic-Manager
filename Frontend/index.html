<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>if (localStorage.getItem('modoOscuro') === '1') document.body.classList.add('modo-oscuro');</script>

  <div class="login-container">
    <h1>PetClinic Manager</h1>
    <p class="subtitulo">Sistema de gestión veterinaria</p>
    <form id="loginForm">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Iniciar sesión</button>
    </form>
    <p id="mensajeError" class="error-mensaje"></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
