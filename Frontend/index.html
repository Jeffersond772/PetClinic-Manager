<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>if (localStorage.getItem('modoOscuro') === '1') document.body.classList.add('modo-oscuro');</script>

  <button type="button" id="btnModoOscuroLogin" class="toggle-modo-login" aria-label="Cambiar modo oscuro">🌙</button>

  <div class="login-visual">
    <div class="login-visual-blob blob-a"></div>
    <div class="login-visual-blob blob-b"></div>
    <div class="login-visual-blob blob-c"></div>
    <div class="login-visual-paws">
      <span class="paw p1">🐾</span>
      <span class="paw p2">🐾</span>
      <span class="paw p3">🐾</span>
      <span class="paw p4">🐾</span>
      <span class="paw p5">🐾</span>
    </div>
    <div class="login-visual-contenido">
      <span class="login-visual-icono">🐾</span>
      <h2>Cuida cada mascota,<br>controla toda tu clínica</h2>
      <p>Pacientes, citas, inventario, ventas y reportes en un solo lugar.</p>
      <div class="login-visual-chips">
        <span class="chip">🐶 Pacientes</span>
        <span class="chip">📅 Citas</span>
        <span class="chip">📦 Inventario</span>
        <span class="chip">📊 Reportes</span>
      </div>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-container">
      <span class="login-logo">🐾</span>
      <h1>PetClinic Manager</h1>
      <p class="subtitulo">Sistema de gestión veterinaria</p>
      <form id="loginForm">
        <label for="correo">Correo</label>
        <div class="campo-icono">
          <span class="campo-icono-simbolo">✉️</span>
          <input type="email" id="correo" name="correo" required>
        </div>

        <label for="password">Contraseña</label>
        <div class="campo-icono campo-icono-password">
          <span class="campo-icono-simbolo">🔒</span>
          <input type="password" id="password" name="password" required>
          <button type="button" id="togglePassword" class="campo-icono-toggle" aria-label="Mostrar contraseña">👁️</button>
        </div>

        <button type="submit" id="btnLogin">Iniciar sesión</button>
      </form>
      <p id="mensajeError" class="error-mensaje"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
