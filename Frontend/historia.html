<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Historia clínica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

  <header class="topbar">
    <h1>PetClinic Manager</h1>
    <div class="usuario-info">
      <span id="nombreUsuario"></span>
      <span id="rolUsuario" class="badge-rol"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebarMenu"></nav>

    <main class="contenido">
      <div class="ficha-paciente" id="fichaPaciente">
        <!-- Datos del paciente, generados dinámicamente -->
      </div>

      <div class="encabezado-seccion">
        <h2>Historial de consultas</h2>
        <div>
          <button id="btnNuevoProcedimiento" class="btn-secundario">Registrar vacuna/procedimiento</button>
          <button id="btnNuevaConsulta" class="btn-primario">Nueva consulta</button>
        </div>
      </div>

      <div id="listaConsultas" class="lista-consultas"></div>

      <h2 class="titulo-seccion-secundaria">Vacunas y procedimientos preventivos</h2>
      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Producto aplicado</th>
            <th>Veterinario</th>
            <th>Observaciones</th>
          </tr>
        </thead>
        <tbody id="tablaProcedimientos"></tbody>
      </table>
    </main>
  </div>

  <!-- Modal: Nueva consulta -->
  <div id="modalConsulta" class="modal-overlay oculto">
    <div class="modal-caja modal-grande">
      <h3>Registrar consulta</h3>
      <form id="formConsulta">
        <label for="motivoConsulta">Motivo de consulta</label>
        <input type="text" id="motivoConsulta">

        <label for="sintomas">Síntomas</label>
        <textarea id="sintomas" rows="2"></textarea>

        <label for="signosVitales">Signos vitales</label>
        <input type="text" id="signosVitales" placeholder="Ej: FC 90, FR 20, Temp 38.5°C">

        <label for="pesoConsulta">Peso (kg)</label>
        <input type="number" step="0.01" id="pesoConsulta">

        <label for="diagnostico">Diagnóstico</label>
        <textarea id="diagnostico" rows="2"></textarea>

        <label for="procedimientosRealizados">Procedimientos realizados</label>
        <textarea id="procedimientosRealizados" rows="2"></textarea>

        <label for="observacionesConsulta">Observaciones</label>
        <textarea id="observacionesConsulta" rows="2"></textarea>

        <div class="separador-tratamientos">
          <div class="encabezado-tratamientos">
            <label>Tratamientos / medicamentos formulados</label>
            <button type="button" id="btnAgregarTratamiento" class="btn-icono">+ Agregar tratamiento</button>
          </div>
          <div id="listaTratamientosForm"></div>
        </div>

        <p id="mensajeErrorConsulta" class="error-mensaje"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelarConsulta" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar consulta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: vacuna / procedimiento preventivo -->
  <div id="modalProcedimiento" class="modal-overlay oculto">
    <div class="modal-caja">
      <h3>Registrar vacuna o procedimiento</h3>
      <form id="formProcedimiento">
        <label for="tipoProcedimiento">Tipo</label>
        <select id="tipoProcedimiento" required>
          <option value="vacuna">Vacuna</option>
          <option value="desparasitacion">Desparasitación</option>
          <option value="otro">Otro</option>
        </select>

        <label for="productoProcedimiento">Producto usado (opcional)</label>
        <select id="productoProcedimiento">
          <option value="">Ninguno / no aplica</option>
        </select>

        <label for="cantidadProcedimiento">Cantidad usada</label>
        <input type="number" step="0.01" id="cantidadProcedimiento">

        <label for="fechaProcedimiento">Fecha</label>
        <input type="date" id="fechaProcedimiento" required>

        <label for="observacionesProcedimiento">Observaciones</label>
        <textarea id="observacionesProcedimiento" rows="2"></textarea>

        <p id="mensajeErrorProcedimiento" class="error-mensaje"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelarProcedimiento" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/historia.js"></script>
</body>
</html>
