<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinic Manager - Gastos</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">
  <script>if (localStorage.getItem('modoOscuro') === '1') document.body.classList.add('modo-oscuro');</script>

  <header class="topbar">
    <h1>PetClinic Manager</h1>
    <div class="usuario-info">
      <span id="nombreUsuario"></span>
      <span id="rolUsuario" class="badge-rol"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebarMenu"></nav>

    <main class="contenido">
      <div class="encabezado-seccion">
        <h2>Gastos del consultorio</h2>
        <button id="btnNuevoGasto" class="btn-primario">Registrar gasto</button>
      </div>

      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Categoría</th>
            <th>Monto</th>
            <th>Registrado por</th>
          </tr>
        </thead>
        <tbody id="tablaGastos"></tbody>
      </table>
    </main>
  </div>

  <div id="modalGasto" class="modal-overlay oculto">
    <div class="modal-caja">
      <h3>Registrar gasto</h3>
      <form id="formGasto">
        <label for="conceptoGasto">Concepto</label>
        <input type="text" id="conceptoGasto" required>

        <label for="categoriaGasto">Categoría</label>
        <input type="text" id="categoriaGasto" placeholder="Servicios, mantenimiento, etc.">

        <label for="montoGasto">Monto</label>
        <input type="number" step="0.01" id="montoGasto" required>

        <label for="fechaGasto">Fecha</label>
        <input type="date" id="fechaGasto" required max="">

        <p id="mensajeErrorGasto" class="error-mensaje"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelarGasto" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/gastos.js"></script>
</body>

</html>
